name: keepalive

# Keeps the free Render instance awake and guarantees a scanner tick even if
# the in-process loop was suspended. Runs entirely in the cloud; nothing here
# depends on a developer machine.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health check
        run: |
          code=$(curl -sS -o health.json -w "%{http_code}" --max-time 60 "${{ secrets.API_BASE_URL }}/api/v1/health")
          cat health.json || true
          test "$code" = "200"

      - name: Scanner tick
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SCANNER_TICK_TOKEN: ${{ secrets.SCANNER_TICK_TOKEN }}
        run: |
          body=$(curl -sS -X POST --max-time 120 \
            -H "X-Scan-Token: ${SCANNER_TICK_TOKEN}" \
            -H "Content-Type: application/json" \
            "${API_BASE_URL}/api/v1/scanner/tick")
          echo "${body}"
          echo "${body}" | grep -q '"status"'
